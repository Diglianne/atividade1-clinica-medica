{% extends 'base.html' %}

{% block title %}Deletar Médico{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card border-danger shadow-sm">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Aviso de Exclusão</h4>
        </div>
        <div class="card-body">
            <p>Tem certeza que deseja apagar o cadastro do médico <strong>{{ medico.nome }}</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sim, Confirmar Exclusão</button>
                <a href="{% url 'medico_listar' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
