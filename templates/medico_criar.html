{% extends 'base.html' %}

{% block title %}Cadastrar Médico{% endblock %}

{% block content %}
<h2>Novo Cadastro de Médico</h2>

<form method="POST">
    {% csrf_token %}
    
    <label>CRM:</label><br>
    <input type="text" name="crm" required><br><br>

    <label>Nome Completo:</label><br>
    <input type="text" name="nome" required><br><br>

    <label>E-mail:</label><br>
    <input type="email" name="email" required><br><br>

    
    <button type="submit">Salvar Médico</button>
    <a href="{% url 'medico_listar' %}">Cancelar</a>
</form>
{% endblock %}
