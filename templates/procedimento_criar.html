{% extends 'base.html' %}

{% block title %}Cadastrar Procedimento{% endblock %}

{% block content %}
<h2>Novo Cadastro de Procedimento</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    
    <label>Código:</label><br>
    <input type="number" name="codigo" required><br><br>

    <label>Nome do Procedimento:</label><br>
    <input type="text" name="nome" required><br><br>

    <label>Foto/Ícone:</label><br>
    <input type="file" name="foto" required><br><br>

    <label>Duração Estimada:</label><br>
    <input type="number" step="0.01" name="duracao_estimada" required><br><br>

    <label>Data de Criação:</label><br>
    <input type="date" name="data_criacao" required><br><br>

    <label>Custo Operacional:</label><br>
    <input type="number" name="custo_operacional" required><br><br>

    <label>Especialidade (ID):</label><br>
    <input type="number" name="especialidade" required><br><br>

    <button type="submit">Salvar Procedimento</button>
    <a href="{% url 'procedimento_listar' %}">Cancelar</a>
</form>
{% endblock %}
