<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clínica Médica{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #2c3e50;
        }
        .sidebar .nav-link {
            color: #ecf0f1;
            padding: 12px 20px;
            margin: 4px 0;
            border-radius: 4px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #34495e;
            color: #3498db;
        }
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
        }
    </style>
</head>
<body>

    <!-- Navbar Topo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-graduation-cap me-2"></i>Gestão Médica
            </a>
            <span class="navbar-text text-white">
                <i class="fa-solid fa-user me-1"></i> Painel Administrativo
            </span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Menu -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
              <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                    <i class="fa-solid fa-chart-line me-2"></i>Dashboard
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link {% if 'paciente' in request.path %}active{% endif %}" href="{% url 'paciente_listar' %}">
                    <i class="fa-solid fa-user-injured me-2"></i>Pacientes
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if 'medico' in request.path %}active{% endif %}" href="{% url 'medico_listar' %}">
                    <i class="fa-solid fa-user-md me-2"></i>Médicos
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if 'agenda' in request.path %}active{% endif %}" href="{% url 'agenda_listar' %}">
                    <i class="fa-solid fa-calendar-alt me-2"></i>Agendas
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if 'atendimento' in request.path %}active{% endif %}" <a href="#">Atendimentos</a>">
                    <i class="fa-solid fa-file-medical me-2"></i>Atendimentos  

                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link {% if 'procedimento' in request.path %}active{% endif %}" href="{% url 'procedimento_listar' %}">
                    <i class="fa-solid fa-stethoscope me-2"></i>Procedimentos
                </a>
            </li>
        </ul>

            </nav>

            <!-- Dynamic Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <!-- Django Messages Alert -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                {% block content %}
                <!-- Child templates render content here -->
                {% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
