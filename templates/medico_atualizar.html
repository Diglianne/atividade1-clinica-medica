{% extends 'base.html' %}

{% block title %}Editar Médico{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0"><i class="fa-solid fa-user-md me-2"></i>Editar Cadastro do Médico</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">CRM:</label>
                    <input type="text" name="crm" value="{{ medico.crm }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nome Completo:</label>
                    <input type="text" name="nome" value="{{ medico.nome }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail:</label>
                    <input type="email" name="email" value="{{ medico.email }}" class="form-control" required>
                </div>
              
                <button type="submit" class="btn btn-success">Salvar Alterações</button>
                <a href="{% url 'medico_listar' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
