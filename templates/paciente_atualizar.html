{% extends 'base.html' %}

{% block title %}Editar Paciente{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="fa-solid fa-user-injured me-2"></i>Editar Cadastro do Paciente</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Nome do Paciente:</label>
                    <input type="text" name="nome" value="{{ paciente.nome }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">CPF:</label>
                    <input type="text" name="cpf" value="{{ paciente.cpf }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefone:</label>
                    <input type="text" name="telefone" value="{{ paciente.telefone }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Data de Nascimento:</label>
                    <input type="date" name="data_nascimento" value="{{ paciente.data_nascimento|date:'Y-m-d' }}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                <a href="{% url 'paciente_listar' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
